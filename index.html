<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf7f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Purrgress, gym but cuter</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="logo">🐱 Purrgress</div>
  <p class="tagline">Gym, but cuter. Built for one hand and a phone.</p>
</header>

<main>
  <section id="view-today" class="view"></section>
  <section id="view-plan" class="view hidden"></section>
  <section id="view-session" class="view hidden"></section>
  <section id="view-history" class="view hidden"></section>
  <section id="view-me" class="view hidden"></section>
</main>

<nav class="bottomnav">
  <button data-nav="today" class="active">Today</button>
  <button data-nav="plan">Plan</button>
  <button data-nav="history">History</button>
  <button data-nav="me">Me</button>
</nav>

<script src="app.js"></script>
</body>
</html>
